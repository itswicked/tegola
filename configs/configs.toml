[webserver]
port = ":8080"

[[providers]]
name = "pokemon"
type = "postgis"
host = "localhost"
database = "pokemon_map"
user = "postgres"
password = "password"

[[providers.layers]]
name = "regions"
geometry_fieldname = "geom"
id_fieldname = "id"
sql = "SELECT ST_AsBinary(geom) AS geom, id, name FROM game_regions"

[[maps]]
name = "pokemon_world"
attribution = "© Your Pokemon App"

  [[maps.layers]]
  provider_layer = "pokemon.regions"
  min_zoom = 0
  max_zoom = 14
